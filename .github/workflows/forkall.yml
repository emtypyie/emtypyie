name: Sync It Baby

# Keeps EVERY forked repo in your account up to date with its upstream.
# Place this workflow in a single repo (e.g. a "housekeeping" or dotfiles repo) —
# it will reach out and sync all your other forks from there.
#
# SETUP REQUIRED:
# 1. Create a Personal Access Token (classic: "repo" scope, or fine-grained:
#    "Contents: Read and write" on all repos) at
#    https://github.com/settings/tokens
# 2. Add it as a repo secret named GH_PAT
#    (Settings -> Secrets and variables -> Actions -> New repository secret)

on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC — edit to change frequency
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  sync-all-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all forked repositories
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          owner="${{ github.repository_owner }}"

          # List every repo you own that is a fork, with its default branch
          repos=$(gh repo list "$owner" --fork --limit 1000 \
            --json nameWithOwner,defaultBranchRef \
            --jq '.[] | select(.defaultBranchRef != null) | "\(.nameWithOwner) \(.defaultBranchRef.name)"')

          if [ -z "$repos" ]; then
            echo "No forked repositories found for $owner."
            exit 0
          fi

          failed=0
          while read -r repo branch; do
            echo "::group::Syncing $repo (branch: $branch)"
            if gh repo sync "$repo" --branch "$branch"; then
              echo "✅ $repo synced"
            else
              echo "::warning::Failed to sync $repo — it may have diverged and need a manual merge"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "$repos"

          exit $failed
