name: Sync It Baby
on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC — edit to change frequency
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  sync-all-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all forked repositories
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail
          owner="${{ github.repository_owner }}"

          echo "Looking up forks owned by: $owner"
          repos=$(gh repo list "$owner" --fork --limit 1000 \
            --json nameWithOwner,defaultBranchRef \
            --jq '.[] | select(.defaultBranchRef != null) | "\(.nameWithOwner) \(.defaultBranchRef.name)"')

          if [ -z "$repos" ]; then
            echo "No forked repositories found for $owner."
            exit 0
          fi

          failed=0
          while read -r repo branch; do
            echo "::group::Syncing $repo (branch: $branch)"
            set +e
            gh repo sync "$repo" --branch "$branch"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "Synced $repo"
            else
              echo "::warning::Failed to sync $repo (exit $rc) — it may have diverged and need a manual merge"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "$repos"

          exit $failed
